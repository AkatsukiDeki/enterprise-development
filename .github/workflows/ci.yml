name: CI

on:
  push:
    branches:
      - main
      - lab1
      - lab1-classes
      - lab2-server
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FoodDelivery.slnx

      - name: Build solution
        run: dotnet build FoodDelivery.slnx --no-restore --configuration Release

      - name: Run Tests
        run: dotnet run --project FoodDelivery.Tests/FoodDelivery.Tests.csproj --no-build --configuration Release
