name: CI

on:
  push:
    branches:
      - main
      - lab1
      - lab1-classes
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FoodDelivery.slnx

      - name: Build solution
        run: dotnet build FoodDelivery.slnx --no-restore --configuration Release

      - name: Run xUnit Tests
        run: dotnet test FoodDelivery.slnx --no-build --configuration Release --verbosity normal